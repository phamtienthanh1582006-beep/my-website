<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Web Của Tôi</title>
    <style>
        /* CSS: Phần trang trí giao diện */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #74b9ff, #dfe6e9);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card {
            background-color: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 {
            color: #2d3436;
            margin-bottom: 10px;
        }
        p {
            color: #636e72;
            font-size: 16px;
            margin-bottom: 25px;
        }
        .btn {
            background-color: #0984e3;
            color: white;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            display: inline-block;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #74b9ff;
        }
    </style>
</head>
<body>

    <!-- HTML: Phần nội dung trang web -->
    <div class="card">
        <h1>Xin chào! 👋</h1>
        <p>Tôi đang tự tay thiết kế trang web đầu tiên của mình trên VS Code.</p>
        <a href="#" class="btn">Tìm hiểu thêm</a>
    </div>

</body>
</html>
